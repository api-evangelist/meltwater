- aid: meltwater:meltwater-mcp
  name: Meltwater MCP
  description: >-
    Meltwater MCP is a single remote Model Context Protocol server that exposes a customer's Meltwater
    assets (saved searches, tags and other configured objects) and Meltwater data (news and social mentions,
    analytics and insights) as tools an AI agent can discover and call. It is authenticated with a Meltwater
    API token today, with OAuth 2.0 discovery documents already live. A second, orchestrated server at
    https://api.meltwater.com/mcp fronts the Mira assistant.
  humanURL: https://developer.meltwater.com/guides/meltwater-mcp/overview
  baseURL: https://api.meltwater.com/v2/mcp
  tags:
  - MCP
  - Agents
  - Artificial Intelligence
