  docs: https://developer.meltwater.com/api-reference/api-reference-overview
  note: >-
    Meltwater is mid-migration. The v3 API is the complete surface (80 operations) and is the
    one described by the downloadable OpenAPI. v4 is being built out and today carries only the
    newer features - Explore+ exports (beta), unified analytics, and AI Visibility / LLM prompts.
    Meltwater states v4 "in time will support all features".
deprecation:
