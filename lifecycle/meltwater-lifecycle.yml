  sunset_header: false
  policy: >-
    Meltwater publishes no formal deprecation policy document and no RFC 8594 Sunset/Deprecation
    header support. Its stated commitment is narrative: "We will communicate to API customers
    planned deprecation dates for features." Individual deprecations are announced on the
    changelog (for example the 21 October 2024 removal of several Facebook metrics) and on the
    Compliance page for data-provider-driven field removals.
